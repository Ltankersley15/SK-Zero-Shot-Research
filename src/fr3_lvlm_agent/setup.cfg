[develop]
script_dir=$base/lib/fr3_lvlm_agent
[install]
install_scripts=$base/lib/fr3_lvlm_agent

[flake8]
max-line-length = 160
jobs = 1
extend-ignore = B902,C414,CNL100,D100,D101,D102,D103,D104,D105,D106,D107,D200,D203,D205,D213,D401,E111,E114,E117,E203,E221,E261,E265,E302,E402,E701,E702,Q000,I100,I101,I201,W291,W293
exclude = build,install,log,.venv,.eggs,__pycache__,archive

[pep257]
ignore = D100,D101,D102,D103,D104,D105,D106,D107,D203,D205,D213,D401
exclude = build,install,log,.venv,.eggs,__pycache__,archive
